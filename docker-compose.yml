services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tether
      POSTGRES_PASSWORD: tether
      POSTGRES_DB: tether
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tether"]
      interval: 2s
      timeout: 3s
      retries: 20
